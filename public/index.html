<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>fin</title>
  <meta name="theme-color" content="#f4f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="fin">
  <script>
    // aplica o tema salvo antes de desenhar a página (evita piscar)
    try { const t = localStorage.getItem('fin-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..800&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar" aria-label="Navegação"></aside>
  <div id="scrim"></div>

  <header class="topbar">
    <button id="menu" class="logo-btn" aria-label="Abrir menu"><img src="/icons/logo-64.png" alt="" width="32" height="32"></button>
    <span class="spacer"></span>
    <button id="theme" class="theme-btn" aria-label="Alternar modo claro/escuro"></button>
  </header>

  <main aria-live="polite">
    <div class="page-head">
      <button class="icon-btn" id="back" hidden aria-label="Voltar">‹</button>
      <h1 id="title"></h1>
      <div id="top-actions"></div>
    </div>
    <div id="view"></div>
  </main>

  <button class="fab" id="fab" aria-label="Novo lançamento">+</button>

  <dialog id="modal"></dialog>
  <div id="toast" role="status"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
